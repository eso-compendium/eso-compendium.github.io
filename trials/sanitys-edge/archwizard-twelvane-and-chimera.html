<style id="theme">:root { color-scheme: dark; --bg: #070504; --paper: #0E0B07; --panel: #1A140D; --panelGrad: linear-gradient(180deg, #231B12 0%, #130F0A 100%); --line: #4A3A24; --frame: #6B5A33; --slot: #2B2217; --ink: #EFE4CC; --muted: #C2AE8A; --faint: #9A8566; --neutral: #9A8566; --accent: #E6B865; --wipe: #FF4D6A; --glow: radial-gradient(90% 70% at 50% 0%, #2A2016 0%, transparent 70%); --font-display: 'Cinzel', Georgia, 'Times New Roman', serif; --font-body: 'Alegreya Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }</style>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
body { display: flex; flex-direction: column; }

button { font-family: inherit; }

/* header */
#hdr { position: relative; flex: none; }
#hdr .kick { font-size: .92cqw; letter-spacing: .08cqw; text-transform: uppercase; color: var(--muted); line-height: 1.5cqw; white-space: nowrap; }

#hdr .kick .back:hover { text-decoration: underline; }
#hdr .slogan { font-size: 1.1cqw; font-style: italic; color: var(--muted); line-height: 1.5cqw; white-space: nowrap; }
#hdr .kick { height: 2.2cqw; display: flex; align-items: center; }
#hdr .ttl { display: block; line-height: 1.2; }
.ttl { font-family: var(--font-display); color: var(--accent); font-weight: 700; white-space: nowrap; }
.hdr-right { position: absolute; right: 0; top: 0; display: flex; align-items: center; gap: .6cqw; width: max-content; }
.seg { display: inline-flex; border: .12cqw solid var(--ink); border-radius: .6cqw; overflow: hidden; }
.seg button, .seg span { border: 0; background: var(--panel); color: var(--ink); padding: .35cqw 1cqw; font-size: 1cqw; font-weight: 600; text-transform: uppercase; letter-spacing: .05cqw; cursor: pointer; }
.seg span { cursor: default; }
.seg button.on, .seg span.on { background: var(--ink); color: var(--paper); }
.btn { border: .12cqw solid var(--line); background: var(--panel); color: var(--ink); padding: .3cqw .9cqw; border-radius: .6cqw; font-size: 1cqw; cursor: pointer; }

/* timeline (spec §12.2, §10.10): the HP lane is a boss bar; a small label "[boss] · HP" at the start of every segment; above every marker the phase icon and the wipe/kill slots of that phase, below it the percentage and the phase name */
#tl { position: relative; flex: none; }
.lane { position: relative; }
.lane .hpl { position: absolute; font-size: .95cqw; font-weight: 700; color: var(--muted); line-height: 1.4cqw; white-space: nowrap; text-transform: uppercase; letter-spacing: .04cqw; border: 0; background: none; padding: 0; text-align: left; font-family: inherit; }
.lane button.hpl { cursor: pointer; color: var(--muted); }
.lane button.hpl:hover { color: var(--ink); text-decoration: underline; }
/* HP lane as a boss bar: filled bar, dark edge, frame outline */
.axis { position: absolute; height: 1.15cqw; border: .14cqw solid var(--bg); outline: .12cqw solid var(--frame); border-radius: .15cqw; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 50%, var(--frame)) 0%, color-mix(in srgb, var(--accent) 20%, var(--frame)) 50%, color-mix(in srgb, var(--frame) 75%, var(--bg)) 100%); }
.axis.empty { background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--line) 80%, transparent) 0 1cqw, transparent 1cqw 1.6cqw), var(--slot); }
.axis.open { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 38%, var(--frame)) 0%, color-mix(in srgb, var(--accent) 12%, var(--frame)) 50%, color-mix(in srgb, var(--frame) 75%, var(--bg)) 100%); }
.endsn { position: absolute; font-size: .9cqw; line-height: 1.25cqw; color: var(--muted); overflow-wrap: break-word; }
.endsn .k { font-weight: 700; }
.seam { position: absolute; width: .12cqw; background: color-mix(in srgb, var(--frame) 70%, transparent); transform: translateX(-50%); }
.pct { position: absolute; font-size: .95cqw; font-weight: 700; transform: translateX(-50%); line-height: 1.4cqw; }
.dot { position: absolute; z-index: 2; width: 1.1cqw; height: 1.1cqw; border-radius: 50%; transform: translate(-50%, 0); border: .15cqw solid var(--bg); }
.dot.knot { width: 1.3cqw; height: 1.3cqw; box-shadow: 0 0 0 .12cqw var(--frame); }
.loop { position: absolute; overflow: visible; color: var(--accent); pointer-events: none; }
.loopl { position: absolute; display: flex; align-items: center; gap: .25cqw; justify-content: center; border: 0; background: none; padding: 0; color: var(--accent); font-size: .9cqw; font-weight: 700; line-height: 1.4cqw; white-space: nowrap; cursor: pointer; }
.loopl .ico { width: 1cqw; height: 1cqw; color: var(--accent); }
.mk.ln { text-align: left; }
.loop.box { z-index: 0; }
.stem { position: absolute; z-index: 1; width: .1cqw; transform: translateX(-50%); background: color-mix(in srgb, var(--muted) 55%, transparent); }
.mg { position: absolute; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: .12cqw; }
.mg .srow { display: flex; align-items: flex-end; justify-content: center; gap: .25cqw; }
.mg .mgi { border: 0; background: none; padding: 0; margin: 0; display: inline-flex; cursor: pointer; color: inherit; }
.mg .mgi .ico { width: var(--ig); height: var(--ig); }
.mg .n { width: .95cqw; flex: none; font-size: .8cqw; font-weight: 700; color: var(--muted); line-height: 1; padding: 0 0 .1cqw; text-align: center; white-space: nowrap; cursor: pointer; border: 0; background: none; }
.mg .slot.hp { width: var(--sz); height: var(--sz); padding: 0; margin: 0; cursor: pointer; border-radius: .3cqw; font: inherit; color: inherit; }
.slot.hp.sm > .ico.sk { width: .7cqw; height: .7cqw; }
.slot.hp.gw { background: color-mix(in srgb, var(--wipe) 26%, var(--slot)); }
.mk { position: absolute; display: block; font-size: .95cqw; line-height: 1.5cqw; border: 0; background: none; padding: 0; color: inherit; cursor: pointer; text-align: center; }
.bm { display: inline-flex; align-items: center; justify-content: center; min-width: 1.6em; font-size: .9em; font-weight: 700; color: var(--muted); }
.blk .head .pl { white-space: normal; }
.pl { font-weight: 500; font-size: .85em; letter-spacing: 0; text-transform: none; color: var(--muted); white-space: nowrap; margin-left: .3em; }
.mk .nm .pl { white-space: normal; }
.ev summary { cursor: pointer; color: var(--accent); font-weight: 600; list-style: none; }
.ev summary::-webkit-details-marker { display: none; }
.ev .evt { margin-top: .2em; color: var(--muted); font-size: .92em; white-space: pre-wrap; overflow-wrap: anywhere; }
.mk .nm { display: block; min-width: 0; overflow-wrap: normal; word-break: normal; color: var(--mc, var(--ink)); font-weight: 600; }
.emptynote { position: absolute; font-size: 1.05cqw; color: var(--muted); font-style: italic; }

/* blocks */
#blocks { flex: none; display: grid; }
/* panels (game UI): chamfered top corners and a thin frame line; CSS only. The frame is the border area of a second background layer; the two diagonals are drawn by ::before and ::after. */
.blk, .seg2, .tile { --fr: var(--frame); position: relative; border: var(--bt) solid transparent; background: var(--panelGrad) padding-box, var(--fr) border-box; clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%, 0 var(--cut)); }
.blk::before, .seg2::before, .tile::before, .blk::after, .seg2::after, .tile::after { content: ''; position: absolute; top: 0; width: var(--cut); height: var(--cut); pointer-events: none; z-index: 3; }
.blk::before, .seg2::before, .tile::before { left: 0; background: linear-gradient(to bottom right, transparent 50%, var(--fr) 50%, var(--fr) calc(50% + var(--bt) * 1.2), transparent calc(50% + var(--bt) * 1.2)); }
.blk::after, .seg2::after, .tile::after { right: 0; background: linear-gradient(to bottom left, transparent 50%, var(--fr) 50%, var(--fr) calc(50% + var(--bt) * 1.2), transparent calc(50% + var(--bt) * 1.2)); }
.blk { overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.blk.np { --fr: var(--faint); background: var(--panelGrad) padding-box, repeating-conic-gradient(var(--fr) 0 25%, transparent 0 50%) 0 0 / .8cqw .8cqw border-box; }
.blk.np .head { color: var(--muted); border-bottom-style: dotted; }
.blk .bar { position: absolute; left: 0; top: var(--cut); bottom: 0; width: .4cqw; background: var(--pc, var(--neutral)); }
.blk .head { flex: none; display: flex; flex-wrap: wrap; align-items: center; align-content: center; column-gap: .4cqw; padding: .25cqw .5cqw .25cqw .9cqw; border: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--fr) 28%, transparent), transparent); color: inherit; text-align: left; cursor: pointer; width: 100%; font-weight: 700; text-transform: uppercase; font-size: .98cqw; line-height: 1.4cqw; letter-spacing: .04cqw; border-bottom: .1cqw solid var(--line); }
.blk .head .nm { min-width: 0; flex: 0 1 auto; color: var(--hc, var(--ink)); }
.blk .head .hsub { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: .4cqw; }
.blk .head .hsub .pl { margin-left: 0; }
.blk .head .tv { margin-left: auto; font-weight: 500; color: var(--hc, var(--muted)); white-space: nowrap; flex: none; text-transform: none; }
.blk .body { flex: none; display: flex; flex-direction: column; padding: var(--bp) var(--bp) var(--bp) calc(var(--bp) + .5cqw); overflow: hidden; }
.blk .body > * { flex: none; }
.row { display: flex; align-items: flex-start; gap: .4cqw; min-height: var(--lh); line-height: var(--lh); width: 100%; padding: 0 .3cqw; border: 0; background: none; color: inherit; font-size: var(--fs); text-align: left; cursor: pointer; border-radius: .3cqw; }
.row:hover, .tchip:hover, .mk:hover, .chip:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); }
.row > .ico { margin-top: calc((var(--lh) - 1.25cqw) / 2); }
.row .tx { min-width: min-content; flex: 0 1 auto; display: flex; flex-direction: column; }
.row .nm, .chip .nm { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: normal; word-break: normal; }
.row > .tag { margin-top: calc((var(--lh) - .95cqw) / 2); flex: 0 1000 auto; min-width: min-content; }
.row .via { color: var(--muted); font-size: .85cqw; line-height: 1.1cqw; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.row .tags { display: flex; flex-wrap: wrap; gap: .2cqw .3cqw; padding: .05cqw 0 .15cqw; line-height: 1; }
.row .nm .meta { display: inline-block; font-size: .8cqw; color: var(--muted); white-space: nowrap; font-weight: 500; margin-left: .15cqw; }
.row .hd { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: .4cqw; min-width: 0; }
.row .hd > .nm { flex: 0 1 auto; min-width: 0; }
.row.wipe .nm { color: var(--wipe); font-weight: 700; }
.row.wipe { padding-top: .12cqw; padding-bottom: .12cqw; }
.row.wipe .tx { align-self: center; }
/* consequence label (spec §12.3): GROUP WIPE is a filled label with a large slot, INSTANT-KILL an outlined label with an ordinary slot */
.sev { flex: none; align-self: center; font-size: .72cqw; font-weight: 700; letter-spacing: .03cqw; line-height: 1; padding: .16cqw .4cqw; border-radius: .25cqw; border: .1cqw solid var(--wipe); color: var(--wipe); white-space: nowrap; }
.sev.gw { background: var(--wipe); color: var(--paper); }
/* callouts on the row itself: timer, repeating timer, interruptible. Own SVG signs, always on one line (spec §10.11) */
.co { flex: none; display: inline-flex; align-items: center; gap: .18cqw; white-space: nowrap; font-size: .85cqw; font-weight: 600; color: var(--muted); }
.co .ico { width: .98cqw; height: .98cqw; color: var(--muted); }
.co .ico svg { stroke-width: 1.7; }
/* Outcome of a step / "[Trigger] -> [Outcome]" of a consequence, literally from the columns */
.row .oc, .row .dl, .sum { color: var(--muted); font-size: .85cqw; line-height: 1.12cqw; font-weight: 500; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: break-word; }
.row .oc, .sum { -webkit-line-clamp: 3; }
.row .dl { -webkit-line-clamp: 4; }
.row .oc .tg2 { color: var(--ink); font-weight: 600; }
.lv1 .row .oc, .lv1 .sum { -webkit-line-clamp: 2; }
.lv2 .row .oc, .lv2 .sum { -webkit-line-clamp: 1; }
.lv3 .row .oc, .lv3 .sum:not(.mo), .lv4 .row .oc, .lv4 .sum:not(.mo), .lv5 .row .oc, .lv5 .sum:not(.mo), .lv6 .row .oc, .lv6 .sum:not(.mo), .lv7 .row .oc, .lv7 .sum:not(.mo), .lv8 .row .oc, .lv8 .sum:not(.mo) { display: none; }
.lv4 .row .dl { -webkit-line-clamp: 3; } .lv5 .row .dl { -webkit-line-clamp: 2; } .lv6 .row .dl, .lv7 .row .dl { -webkit-line-clamp: 1; }
/* level 8, after the slots (spec §12.16 point 42): the slots shrink once more (1.5 and 2 line heights) and the text of a consequence goes as the very last cut, so that a Mechanic chip with its Outcome stays before "+ N more"; the text stays in the drawer and the reference */
.lv8 .row .dl { display: none; }
.sum { margin: 0 .3cqw .2cqw; cursor: pointer; border: 0; background: none; text-align: left; padding: 0; font-family: inherit; width: calc(100% - .6cqw); }
.sum:hover { color: var(--ink); }
.sum.mo { -webkit-line-clamp: 2; margin-left: .3cqw; }   /* the Outcome of a Mechanic without Steps stays at every compaction level: one line from level 2 */
.lv2 .sum.mo, .lv3 .sum.mo, .lv4 .sum.mo, .lv5 .sum.mo, .lv6 .sum.mo, .lv7 .sum.mo, .lv8 .sum.mo { -webkit-line-clamp: 1; }
/* level 7, the last resort before a row goes behind "+ N more": the skill slots shrink to 1.75 line heights and the place line under a name goes (the place is on the card anyway, in its chip or under the step) */
.lv7 .slot { width: calc(var(--lh) * 1.75); height: calc(var(--lh) * 1.75); }
.lv7 .slot.gw { width: calc(var(--lh) * 2.25); height: calc(var(--lh) * 2.25); }
.lv8 .slot { width: calc(var(--lh) * 1.5); height: calc(var(--lh) * 1.5); }
.lv8 .slot.gw { width: calc(var(--lh) * 2); height: calc(var(--lh) * 2); }
.lv7 .row .loc2, .lv8 .row .loc2 { display: none; }
.row .loc2 { color: var(--muted); font-size: .8cqw; line-height: 1.05cqw; }
.row.cause { min-height: 0; }
.row.cause .nm { color: var(--muted); font-weight: 600; font-size: .9cqw; }
.cu { display: block; }
.row .dl .ar { color: var(--faint); padding: 0 .15cqw; }
/* skill slot: the Shape icon, large, in a square slot like an action bar (spec §8); wipe/kill slots are hot: border and icon in the wipe colour with a soft glow, small skull in the corner */
.slot { position: relative; flex: none; display: inline-flex; align-items: center; justify-content: center; width: calc(var(--lh) * 2.2); height: calc(var(--lh) * 2.2); background: var(--slot); border: .12cqw solid var(--frame); border-radius: .35cqw; box-shadow: inset 0 .12cqw .5cqw color-mix(in srgb, var(--bg) 75%, transparent); }
.slot.gw { width: calc(var(--lh) * 2.9); height: calc(var(--lh) * 2.9); }
.slot > .ico { width: 62%; height: 62%; }
.slot > .ico svg { stroke-width: 1.9; }
.slot .ico .mod { background: var(--slot); }
.slot.hot { border-color: var(--wipe); box-shadow: inset 0 .12cqw .5cqw color-mix(in srgb, var(--bg) 75%, transparent), 0 0 .8cqw color-mix(in srgb, var(--wipe) 40%, transparent); }
.slot.hot > .ico:not(.sk) { color: var(--ic, var(--wipe)); }
.slot > .ico.sk { position: absolute; top: .1cqw; right: .1cqw; width: .95cqw; height: .95cqw; }
.slot .skull circle { fill: var(--slot); }
.row.ind { padding-left: 1.4cqw; }
.row.kid { padding-left: 2.1cqw; }
.ghead { display: flex; align-items: flex-start; gap: .35cqw; min-height: var(--lh); line-height: var(--lh); font-size: .85cqw; font-weight: 700; letter-spacing: .05cqw; color: var(--muted); text-transform: uppercase; }
.ghead i { width: .8cqw; height: .8cqw; border-radius: 50%; background: var(--gc, var(--neutral)); flex: none; margin-top: calc((var(--lh) - .8cqw) / 2); }
.ghead .lnk { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05cqw; font-size: .85cqw; text-align: left; line-height: var(--lh); }
.gcols { display: grid; column-gap: .5cqw; }
.gcol { min-width: 0; }
.fcols { display: flex; column-gap: .8cqw; align-items: flex-start; }
.fcol { min-width: 0; flex: none; }
.item { display: block; }
.chips { display: flex; flex-wrap: wrap; column-gap: .5cqw; align-content: flex-start; }
.chip { display: inline-flex; align-items: flex-start; gap: .35cqw; min-height: var(--lh); line-height: var(--lh); font-size: .95cqw; color: inherit; background: color-mix(in srgb, var(--ink) 7%, transparent); border: 0; border-radius: .6cqw; padding: 0 .55cqw; cursor: pointer; max-width: 100%; text-align: left; }
.chip > .ico { margin-top: calc((var(--lh) - 1.25cqw) / 2); }
.chip.loc .nm { -webkit-line-clamp: unset; display: block; }
.chip .lc { color: var(--muted); font-weight: 600; }
.chip.loc { cursor: pointer; }
.chip.loc:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.chip.loc .lcl, .chip.loc .rn { border: 0; background: none; padding: 0; font: inherit; color: var(--rc, inherit); cursor: pointer; text-align: left; }
.chip.loc .lcl { color: var(--muted); font-weight: 600; }
.chip.loc .lcl:hover, .chip.loc .rn:hover { text-decoration: underline; }
.chip.loc .rn { font-weight: 600; }
.chip.loc .pin { cursor: pointer; display: inline-flex; }
.addg { display: inline-flex; flex-wrap: wrap; align-items: flex-start; column-gap: .25cqw; }
.addw { display: inline-flex; align-items: center; gap: .15cqw; min-height: var(--lh); font-size: .85cqw; color: var(--wipe); font-weight: 700; border: 0; background: none; padding: 0 .2cqw; cursor: pointer; font-family: inherit; }
.addw:hover { text-decoration: underline; }
.addw .ico { width: .95cqw; height: .95cqw; }
.ewr { padding: 0 0 0 1.7cqw; }   /* a short wipe/kill reference under an entity (spec §12.15 point 35) */
.addg.refs { display: flex; flex-wrap: wrap; column-gap: .6cqw; }
/* crowd control: a small text label after the name, in the style of the other labels (spec §12.12 point 24) */
.cc { flex: none; align-self: center; font-size: .68cqw; font-weight: 700; letter-spacing: .03cqw; line-height: 1; padding: .14cqw .36cqw; border-radius: .25cqw; border: .1cqw solid var(--muted); color: var(--muted); white-space: nowrap; }
/* cycle line in a block of the loop (spec §12.14 point 32) */
.cyc { display: block; margin-top: .1cqw; }
.cyl { display: inline-flex; align-items: flex-start; gap: .35cqw; min-height: var(--lh); line-height: var(--lh); font-size: .95cqw; color: var(--ink); background: none; border: 0; padding: 0 .3cqw; cursor: pointer; text-align: left; font-weight: 600; }
.cyl:hover { text-decoration: underline; }
.cyl > .ico { margin-top: calc((var(--lh) - 1.25cqw) / 2); }
.cyl .nm { display: block; }
/* Heavy damage: second layer, a short line per row (icon and name, colour from Damage type, no frame, never red) */
.hv { display: flex; flex-wrap: wrap; column-gap: .9cqw; row-gap: 0; margin-top: .15cqw; }
.hvr { display: inline-flex; align-items: flex-start; gap: .3cqw; min-height: var(--lh); line-height: var(--lh); font-size: .95cqw; color: var(--rc, var(--muted)); border: 0; background: none; padding: 0; cursor: pointer; font-family: inherit; text-align: left; font-weight: 600; }
.hvr > .ico { margin-top: calc((var(--lh) - 1.05cqw) / 2); width: 1.05cqw; height: 1.05cqw; flex: none; }
.hvr:hover .nm { text-decoration: underline; }
.chip.plain { background: none; padding: 0 .15cqw; color: var(--muted); cursor: default; }
.chip.plain:hover { background: none; }
.sep { color: var(--muted); min-height: var(--lh); line-height: var(--lh); }
/* numbered steps in one column (spec §12.3): number, name, Outcome; consequences nested under the step */
.steps { display: flex; flex-direction: column; }
.unit { display: block; }
.ustep { position: relative; }
.ustep::before { content: ''; position: absolute; left: .93cqw; top: calc((var(--lh) + 1.3cqw) / 2 + .05cqw); bottom: -.05cqw; width: .1cqw; background: var(--line); }
.unit.last .ustep::before { display: none; }
.row .num { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 1.3cqw; height: 1.3cqw; margin-top: calc((var(--lh) - 1.3cqw) / 2); border: .1cqw solid var(--ink); border-radius: 50%; font-size: .8cqw; font-weight: 700; line-height: 1; color: var(--ink); background: var(--panel); position: relative; z-index: 1; }
.row.step > .slot { margin-top: .1cqw; }
.ends { margin-top: auto; padding: .25cqw .4cqw 0; border-top: .08cqw solid color-mix(in srgb, var(--line) 75%, transparent); font-size: .9cqw; line-height: 1.25cqw; color: var(--muted); overflow-wrap: break-word; }
.ends .k { font-weight: 700; letter-spacing: .02cqw; }
.more { display: flex; align-items: center; min-height: var(--lh); padding: 0 .4cqw; border: 0; background: none; color: var(--muted); font-size: .95cqw; font-weight: 600; cursor: pointer; width: 100%; text-align: left; }
.more:hover, .infull:hover { text-decoration: underline; }
.infull { display: inline-flex; align-items: center; min-height: var(--lh); padding: 0 .4cqw; border: 0; background: none; color: var(--accent); font-size: .95cqw; font-weight: 600; cursor: pointer; text-align: left; white-space: nowrap; }
.mrow { display: flex; flex-wrap: wrap; column-gap: .6cqw; align-items: center; }
.mrow .more { width: auto; }
.foot { display: flex; align-items: center; min-height: var(--lh); padding: 0 .4cqw; border: 0; background: none; color: var(--muted); font-size: .9cqw; cursor: pointer; width: 100%; text-align: left; }
.foot:hover { text-decoration: underline; }

/* strip under the bar: "After each ..." per phase, compact legend at the right (spec §12.2) */
#strip { flex: none; display: flex; align-items: flex-start; column-gap: 1cqw; padding: .3cqw .7cqw; border-top: .1cqw solid var(--line); border-bottom: .1cqw solid var(--line); background: color-mix(in srgb, var(--panel) 45%, transparent); }
#strip .sl { flex: 1 1 0; min-width: 0; }
.sg { flex: none; display: flex; flex-wrap: wrap; justify-content: flex-end; align-content: flex-start; column-gap: .9cqw; row-gap: 0; font-size: .82cqw; color: var(--muted); line-height: 1.3cqw; }
.sg .lg { display: inline-flex; align-items: center; gap: .3cqw; white-space: nowrap; }
.sg .lg i.d { width: .75cqw; height: .75cqw; border-radius: 50%; background: var(--gc, var(--neutral)); flex: none; }
.sg .sev { font-size: .68cqw; }
.sn { border: 0; background: none; padding: 0 .1cqw; font: inherit; font-weight: 600; color: var(--ec, var(--ink)); cursor: pointer; text-align: left; }
.sn:hover { text-decoration: underline; }
.sn.wipe { color: var(--wipe); font-weight: 700; }
.sn .ico { vertical-align: -.2cqw; margin-right: .15cqw; width: 1cqw; height: 1cqw; }
.flow { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: .5cqw; align-content: flex-start; overflow: hidden; }
.flow .gl i { width: .7cqw; height: .7cqw; border-radius: 50%; background: var(--gc, var(--neutral)); flex: none; }
.flow .lbl { font-size: .9cqw; font-weight: 700; letter-spacing: .05cqw; text-transform: uppercase; color: var(--hc, var(--muted)); min-height: var(--lh); line-height: var(--lh); border: 0; background: none; padding: 0; cursor: pointer; text-align: left; max-width: 100%; white-space: nowrap; }
.flow .gl { font-size: .78cqw; font-weight: 700; letter-spacing: .05cqw; color: var(--ec, var(--muted)); text-transform: uppercase; min-height: var(--lh); line-height: var(--lh); display: inline-flex; align-items: center; gap: .3cqw; white-space: nowrap; }
.flow .more { width: auto; white-space: nowrap; }
.flow .chip { white-space: nowrap; }

/* footer */
#ftr { flex: none; display: flex; flex-direction: column; font-size: .95cqw; color: var(--muted); border-top: .1cqw solid var(--line); }
#ftr .frow { flex: none; display: flex; align-items: center; column-gap: 1.5cqw; min-height: 2.2cqw; }
#ftr .fl { line-height: 1.45cqw; padding: .35cqw 0; white-space: normal; }   /* spec §12.17 punt 48: the text runs on to a second line, never cut off */
#ftr .fl .pc { white-space: nowrap; }
#ftr .srcl, #ftr .wm { white-space: nowrap; }
#ftr .fdis { flex: none; font-size: .8cqw; line-height: 1.2cqw; padding-bottom: .2cqw; color: var(--faint); white-space: normal; }
#ftr .fl { flex: 1 1 auto; min-width: 0; }
#ftr .srcl { flex: none; color: var(--accent); font-weight: 600; text-decoration: none; }
#ftr .srcl:hover { text-decoration: underline; }
.wm { flex: none; margin-left: auto; font-family: var(--font-display); font-weight: 700; letter-spacing: .08cqw; text-transform: uppercase; color: var(--accent); font-size: .9cqw; }
.wm .tg { font-weight: 600; letter-spacing: .02cqw; text-transform: none; color: var(--muted); }

/* icons */
.ico { position: relative; display: inline-flex; width: 1.25cqw; height: 1.25cqw; flex: none; color: var(--ic, var(--neutral)); }
.ico svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.ico.skull { color: var(--wipe); }
.ico.skull svg { stroke: none; }
.ico .mods { position: absolute; right: -.35cqw; bottom: -.35cqw; display: flex; gap: .05cqw; }
.ico .mod { width: .72cqw; height: .72cqw; background: var(--panel); border-radius: 50%; color: var(--ink); display: inline-flex; }
.ico .mod svg { stroke-width: 1; }
.ico.big { width: 1.7cqw; height: 1.7cqw; }
.tag.wrap { white-space: normal; line-height: 1.15; max-width: 100%; }
.tag { flex: none; font-size: .75cqw; line-height: 1; padding: .14cqw .38cqw; border: .1cqw solid var(--muted); border-radius: .5cqw; color: var(--muted); font-weight: 600; letter-spacing: .03cqw; white-space: nowrap; }

/* drawer */
/* the drawer hangs on the viewport, not on the card canvas: opaque, above everything, the same size at every zoom (spec §12.15 point 36). #dwrap is a container of its own, so the cqw sizes inside keep their meaning */
#dwrap { --cut: .9cqw; --bt: .12cqw; position: fixed; top: 0; right: 0; bottom: 0; width: var(--dpx, 1000px); container-type: inline-size; z-index: 60; pointer-events: none; visibility: hidden; transition: visibility 0s .2s; color: var(--ink); font-family: var(--font-body); }
#dwrap.open { visibility: visible; transition: none; }
#drawer { pointer-events: auto; position: absolute; top: 0; right: 0; bottom: 0; width: 34cqw; background-color: var(--panel); background-image: var(--panelGrad); border-left: .15cqw solid var(--frame); box-shadow: -.6cqw 0 1.6cqw color-mix(in srgb, var(--bg) 70%, transparent); transform: translateX(102%); transition: transform .18s ease; display: flex; flex-direction: column; font-size: 1.12cqw; line-height: 1.5; }
#drawer .dlink { margin-top: 1.4cqw; padding-top: .8cqw; border-top: .08cqw solid var(--line); }
#drawer.open { transform: none; }
#drawer .top { flex: none; display: flex; align-items: flex-start; gap: .6cqw; padding: .8cqw 1cqw; border-bottom: .1cqw solid var(--line); background: var(--paper); }
#drawer .path { flex: 1; display: flex; flex-wrap: wrap; gap: .1cqw .3cqw; font-size: .95cqw; color: var(--muted); }
#drawer .path button { border: 0; background: none; padding: 0; font: inherit; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: .15cqw; }
#drawer .path .cur { color: var(--ink); font-weight: 600; }
#drawer .x { flex: none; border: .12cqw solid var(--line); background: var(--panel); border-radius: .5cqw; width: 2.4cqw; height: 2.4cqw; font-size: 1.5cqw; line-height: 1; cursor: pointer; color: var(--ink); }
#drawer .scroll { flex: 1; overflow: auto; padding: 1cqw 1.2cqw 2cqw; }
#drawer h3 { margin: 0 0 .6cqw; font-family: var(--font-display); font-size: 1.7cqw; line-height: 1.25; display: flex; align-items: center; flex-wrap: wrap; gap: .5cqw; }
#drawer h3 .red { color: var(--wipe); }
#drawer h4 { margin: 1.3cqw 0 .4cqw; font-size: .9cqw; letter-spacing: .06cqw; text-transform: uppercase; color: var(--muted); }
#drawer h5 { margin: .8cqw 0 .2cqw; font-size: .85cqw; letter-spacing: .05cqw; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: .35cqw; }
#drawer h5 i { width: .8cqw; height: .8cqw; border-radius: 50%; background: var(--gc, var(--neutral)); }
.badge { font-family: var(--font-body); font-size: .85cqw; font-weight: 700; letter-spacing: .04cqw; padding: .18cqw .6cqw; border-radius: .6cqw; border: .12cqw solid var(--ink); color: var(--ink); text-transform: none; }
.badge.b-VERIFIED { background: var(--ink); color: var(--paper); }
.badge.b-OBSERVED, .badge.b-UNVERIFIED { border-style: dashed; color: var(--muted); border-color: var(--muted); }
.fields { display: grid; grid-template-columns: max-content 1fr; column-gap: 1cqw; row-gap: .35cqw; margin: .4cqw 0; }
.fields .k { color: var(--muted); font-size: .95cqw; padding-top: .1cqw; }
.fields .v { min-width: 0; overflow-wrap: anywhere; }
.fields .v a, .lnk { color: var(--ink); text-decoration: underline; text-underline-offset: .15cqw; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
.mbtn { margin-top: .8cqw; border: .12cqw solid var(--line); background: var(--paper); padding: .3cqw .9cqw; border-radius: .6cqw; font-size: .95cqw; cursor: pointer; color: var(--ink); }
.more-fields { display: none; }
.more-fields.open { display: block; }
#drawer .row { min-height: 2.2cqw; line-height: 1.3; font-size: 1.05cqw; padding: .25cqw .3cqw; align-items: center; }
#drawer .row > .ico, #drawer .row > .tag { margin-top: 0; }
#drawer .row .nm, #drawer .row .oc, #drawer .row .dl { -webkit-line-clamp: unset; display: block; }
#drawer .chip { min-height: 2cqw; font-size: 1cqw; }
#drawer .chip .nm { -webkit-line-clamp: unset; display: block; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11cqw, 1fr)); gap: .5cqw .8cqw; }
.lgrid .it { display: flex; align-items: center; gap: .5cqw; font-size: 1cqw; }
.sw { width: 1.4cqw; height: 1.4cqw; border-radius: .3cqw; flex: none; }

/* trial page (spec §12.6): a scrolling page in the same theme; units are rem so it reads on a phone too */
body.tp { display: block; height: auto; min-height: 100%; }
#trial { max-width: 64rem; margin: 0 auto; padding: 1.6rem 1.1rem 1.2rem; }
#trial .kick { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: .4rem .8rem; align-items: center; }
#trial h1 { margin: .35rem 0 .3rem; font-size: clamp(1.7rem, 4.2vw, 2.7rem); line-height: 1.15; white-space: normal; }
#trial .info { margin: 0 0 .35rem; color: var(--muted); font-size: .95rem; }
#trial .slogan { margin: 0 0 .3rem; color: var(--muted); font-style: italic; font-size: 1.05rem; }
#trial .prov { margin: 0 0 1rem; color: var(--faint); font-size: .85rem; max-width: 46rem; }
#trial .bar { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; margin: 0 0 1rem; padding: .6rem 0; border-top: .06rem solid var(--line); border-bottom: .06rem solid var(--line); color: var(--muted); font-size: .9rem; }
#trial .seg { font-size: .9rem; }
#trial .seg button, #trial .seg span { font-size: .85rem; padding: .35rem .9rem; }
#trial .tiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1rem; }
#trial .tiles li { display: flex; }
#trial .ct { white-space: nowrap; }
#trial .tile { flex: 1; --cut: .8rem; --bt: .08rem; display: flex; flex-direction: column; gap: .35rem; min-height: 9.5rem; padding: 1rem 1.1rem 1rem; color: inherit; text-decoration: none; }
#trial .tile:hover { background: linear-gradient(color-mix(in srgb, var(--ink) 8%, transparent), color-mix(in srgb, var(--ink) 8%, transparent)), var(--panelGrad) padding-box, var(--frame) border-box; }
#trial .tile .k { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
#trial .tile h2 { margin: 0; font-size: 1.35rem; line-height: 1.2; white-space: normal; }
#trial .tile .cnt { color: var(--ink); font-size: .95rem; }
#trial .tile .go { margin-top: auto; color: var(--accent); font-weight: 700; font-size: .9rem; }
#trial footer { margin-top: 1.6rem; padding-top: .7rem; border-top: .06rem solid var(--line); display: flex; flex-wrap: wrap; gap: .4rem 1rem; align-items: center; color: var(--muted); font-size: .8rem; }
#trial footer .fdis { flex: 1 0 100%; margin: 0; color: var(--faint); font-size: .7rem; line-height: 1.4; }
#trial .sources { margin-top: 1.8rem; padding-top: .8rem; border-top: .06rem solid var(--line); }
#trial .sources h2 { margin: 0 0 .5rem; font-size: 1.1rem; color: var(--accent); font-family: var(--font-display); }
#trial .sources ul { margin: 0; padding-left: 1.1rem; color: var(--muted); font-size: .92rem; line-height: 1.6; }
#trial .sources a { color: var(--ink); }
#trial footer .wm { font-size: .8rem; }

/* reference work under the card (spec §10.16): outside the fixed frame, rem units, columns follow the screen width; nothing is cut off */
#ref { max-width: 96rem; margin: 1.8rem auto 2.6rem; padding: 0 .75rem; color: var(--ink); font-size: 1rem; line-height: 1.4; }
#ref .rhead { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.2rem; margin: 0 0 1rem; padding-bottom: .6rem; border-bottom: .06rem solid var(--line); }
#ref .rtag { margin: .25rem 0 0; color: var(--faint); font-size: .8rem; line-height: 1.3; }
#ref .rt { margin: 0; font-family: var(--font-display); color: var(--accent); font-size: 1.6rem; line-height: 1.2; }
#ref .rhead .seg { font-size: .85rem; }
#ref .rhead .seg button, #ref .rhead .seg span { font-size: .8rem; padding: .3rem .8rem; }
#ref .rcols { display: block; }   /* every section stands full width, one under the other (spec §12.11 point 19); only the cards inside a (sub)section flow in columns */
#ref .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(24rem, 1fr)); column-gap: 1.3rem; align-items: start; }   /* cards read left to right in rows; empty room under a shorter card is fine (spec §12.13 point 26) */
#ref .rsteps { display: grid; grid-template-columns: repeat(auto-fill, minmax(24rem, 1fr)); column-gap: 1.3rem; align-items: start; }
#ref .rgrid > *, #ref .rsteps > * { min-width: 0; }   /* a card may be narrower than its longest unbroken line (the closed Outcome is cut with an ellipsis) */
@media (max-width: 40rem) { #ref .rgrid { grid-template-columns: minmax(0, 1fr); } #ref .rsteps { grid-template-columns: minmax(0, 1fr); } }
#ref .ico { width: 1.1rem; height: 1.1rem; }
#ref .ico.big { width: 1.5rem; height: 1.5rem; }
#ref .ico .mods { right: -.3rem; bottom: -.3rem; } #ref .ico .mod { width: .66rem; height: .66rem; }
#ref .slot { width: 2.3rem; height: 2.3rem; border-width: .08rem; border-radius: .3rem; box-shadow: inset 0 .08rem .3rem color-mix(in srgb, var(--bg) 75%, transparent); }
#ref .slot.hot { box-shadow: inset 0 .08rem .3rem color-mix(in srgb, var(--bg) 75%, transparent), 0 0 .5rem color-mix(in srgb, var(--wipe) 40%, transparent); }
#ref .slot.gw { width: 2.8rem; height: 2.8rem; }
#ref .slot > .ico { width: 62%; height: 62%; }
#ref .slot > .ico.sk { width: .85rem; height: .85rem; top: .08rem; right: .08rem; }
#ref .sev { font-size: .68rem; padding: .14rem .36rem; border-width: .07rem; border-radius: .22rem; }
#ref .tag { font-size: .7rem; padding: .12rem .35rem; border-width: .07rem; border-radius: .45rem; }
#ref .co { font-size: .8rem; gap: .16rem; } #ref .co .ico { width: .95rem; height: .95rem; }
#ref .badge { font-size: .68rem; padding: .1rem .45rem; border-width: .07rem; border-radius: .5rem; }
.refsec { display: block; margin: 0 0 1.5rem; padding: 0 0 0 .85rem; border-left: .25rem solid var(--pc, var(--neutral)); }
.refsec.np { border-left-style: dotted; border-left-color: var(--faint); }
.refsec.np .rsh .nm { color: var(--muted); }
.refsec.flash, .rc.flash, .rsub.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 28%, transparent); } 100% { background: transparent; } }
.rsh { break-after: avoid; margin: 0 0 .6rem; }
.rsh .l1 { display: flex; flex-wrap: wrap; align-items: center; gap: .2rem .6rem; }
.rsh .nm { margin: 0; font-family: var(--font-display); font-size: 1.3rem; line-height: 1.2; color: var(--hc, var(--ink)); }
.rsh .tv { color: var(--hc, var(--muted)); font-weight: 600; font-size: .95rem; }
.rsh .en { margin-top: .15rem; color: var(--muted); font-size: .9rem; }
.rsh .en .k { font-weight: 700; }
.rsh .sub { color: var(--muted); font-size: .85rem; margin-top: .1rem; }
.rh2 { margin: .9rem 0 .4rem; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; break-after: avoid; }
.rsum { margin: 0 0 .6rem; color: var(--ink); font-size: .95rem; cursor: pointer; border: 0; background: none; text-align: left; padding: 0; font-family: inherit; display: block; }
.rsum:hover { text-decoration: underline; }
.rc { --dc: initial; break-inside: avoid; margin: 0 0 .4rem; padding: .3rem .6rem .35rem .65rem; border: .06rem solid var(--line); border-left: .26rem solid var(--dc, var(--neutral)); background: color-mix(in srgb, var(--panel) 88%, transparent); border-radius: .25rem; }
.rc.wipe { border-color: color-mix(in srgb, var(--wipe) 55%, var(--line)); border-left-color: var(--dc, var(--wipe)); }
.rcd > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: .2rem .5rem; min-height: 1.6rem; }
.rcd > summary::-webkit-details-marker { display: none; }
.rcd > summary { flex-wrap: wrap; }
.rcd > summary:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.rcd > summary .chev { flex: none; width: .7rem; color: var(--muted); font-weight: 700; transition: transform .12s; }
.rcd[open] > summary .chev { transform: rotate(90deg); }
.rcd > summary .nm { flex: none; max-width: 60%; font-weight: 700; font-size: 1rem; }
.rc.wipe .rcd > summary .nm { color: var(--wipe); }
.rcd > summary .rsev { flex: none; font-size: .78rem; color: var(--muted); }
.rcd > summary .ro { flex: 1 1 7rem; min-width: 7rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .85rem; color: var(--muted); }
.rcd[open] > summary .ro { white-space: normal; overflow: visible; text-overflow: clip; }
.rcd > summary .tag { flex: none; }
.rcd > summary.h4 { font-size: 1rem; }
.rcd > summary.h4 .nm { font-family: var(--font-display); }
.rcd .rbody { padding: .1rem 0 .1rem 1.2rem; }
.rcd .rbadge { margin: .15rem 0 0; }
.rcd .miss { grid-column: 1 / -1; color: var(--muted); font-size: .82rem; font-style: italic; margin-top: .15rem; }
.rsub > details.sub { margin: 0 0 .4rem; }
.rc .rh { display: flex; flex-wrap: wrap; align-items: center; gap: .2rem .5rem; }
.rc .rh .nm { font-weight: 700; font-size: 1.02rem; }
.rc.wipe .rh .nm { color: var(--wipe); }
.rc .rh button.nm { border: 0; background: none; padding: 0; color: inherit; font-family: inherit; cursor: pointer; text-align: left; }
.rc .rh button.nm:hover { text-decoration: underline; }
.rc .rnum { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 1.5rem; height: 1.5rem; border: .08rem solid var(--ink); border-radius: 50%; font-size: .85rem; font-weight: 700; background: var(--panel); }
.rc .lead { margin: 0; flex: 1 0 100%; padding-left: 1.2rem; font-size: .9rem; font-weight: 400; color: var(--ink); }
.rc .lead .tg2 { font-weight: 700; }
.rc .rloc { font-size: .8rem; color: var(--muted); margin-top: .1rem; }
.rf { display: grid; grid-template-columns: max-content 1fr; column-gap: .8rem; row-gap: .1rem; margin: .4rem 0 0; font-size: .84rem; }
.rf .k { color: var(--muted); }
.rf .v { min-width: 0; overflow-wrap: anywhere; }
